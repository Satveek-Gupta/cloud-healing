version: '3.9'

# ══════════════════════════════════════════════════════════════════
#  SelfHeal — Docker Compose
#  Provides local Redis for development.
#  Production: use managed Redis (Upstash, Redis Cloud, Railway).
# ══════════════════════════════════════════════════════════════════

services:

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: selfheal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Commander (optional UI) ─────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: selfheal-redis-ui
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - ui

  # ── Processing Engine ─────────────────────────────────────────
  processing-engine:
    build:
      context: ./services/processing-engine
      dockerfile: Dockerfile
    container_name: selfheal-processing-engine
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      CONSUMER_GROUP: processing-engine
      CONSUMER_NAME: engine-1
      STREAM_NAME: telemetry_stream
      BATCH_SIZE: "10"
      BLOCK_MS: "5000"
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - full

  # ── Backend (optional — usually run locally with node --watch) ─
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: selfheal-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - full

volumes:
  redis_data:
    driver: local
